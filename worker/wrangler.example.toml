# Template. Copy it to wrangler.toml and fill in your values; wrangler.toml is not in git,
# so a "git pull" never touches your settings.
#   cp wrangler.example.toml wrangler.toml
#
# Cloudflare Worker for the anonymous reports of gl-helper-triage.sh. See worker/README.md.
name = "csa-2026-01-report"
main = "src/index.js"
compatibility_date = "2026-11-01"
# Off: the worker answers only on its own addresses in the gl-i.net zone, where the
# Cloudflare rules (rate limit) apply. The workers.dev address would skip them.
workers_dev = false
preview_urls = false

# Keep the sender out of the logs as well.
[observability]
enabled = false

[[kv_namespaces]]
binding = "REPORTS"
# Put the id that "npx wrangler kv namespace create REPORTS" prints here.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Reports live in D1 once this block is filled in; until then they stay in KV.
# See "Moving the reports to D1" in README.md.
# [[d1_databases]]
# binding = "DB"
# database_name = "csa-2026-01"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
